services:
  - type: web
    name: acolher-ouvir-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /tmp/acolher-ouvir.sqlite
      - key: CORS_ORIGINS
        value: https://setembroamarelo.github.io
      - key: GEMINI_API_KEY
        sync: false