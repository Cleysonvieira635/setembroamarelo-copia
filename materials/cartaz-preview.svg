<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1414" viewBox="0 0 1000 1414" role="img" aria-labelledby="title desc">
  <title id="title">Cartaz Acolher &amp; Ouvir</title>
  <desc id="desc">Cartaz de apoio emocional com orientações de escuta e contatos 188 e 192.</desc>
  <rect width="1000" height="1414" fill="#F3F6F1"/>
  <path d="M0 0h1000v490H0z" fill="#173F3B"/>
  <circle cx="836" cy="126" r="82" fill="#F1B45B"/>
  <path d="M800 126h72M836 90v72" stroke="#173F3B" stroke-width="10" stroke-linecap="round"/>
  <text x="88" y="100" fill="#DDE9E2" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">ACOLHER &amp; OUVIR</text>
  <text x="88" y="250" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="64" font-weight="700">
    <tspan x="88" dy="0">Você não precisa</tspan>
    <tspan x="88" dy="78">passar por tudo</tspan>
    <tspan x="88" dy="78">sozinho.</tspan>
  </text>
  <text x="88" y="446" fill="#DDE9E2" font-family="Arial,sans-serif" font-size="25">Uma conversa acolhedora pode ser um primeiro passo.</text>
  <rect x="88" y="580" width="824" height="250" rx="30" fill="#FFFFFF"/>
  <text x="500" y="690" text-anchor="middle" fill="#173F3B" font-family="Arial,sans-serif" font-size="68" font-weight="700">CVV 188</text>
  <text x="500" y="760" text-anchor="middle" fill="#405651" font-family="Arial,sans-serif" font-size="28">Apoio emocional gratuito, 24 horas.</text>
  <text x="500" y="950" text-anchor="middle" fill="#173F3B" font-family="Arial,sans-serif" font-size="30" font-weight="700">Escute sem julgar. Ofereça companhia.</text>
  <text x="500" y="1016" text-anchor="middle" fill="#405651" font-family="Arial,sans-serif" font-size="25">Ajude a buscar apoio profissional e de confiança.</text>
  <path d="M140 1090h720" stroke="#D7E0D9" stroke-width="3"/>
  <text x="500" y="1170" text-anchor="middle" fill="#C45D42" font-family="Arial,sans-serif" font-size="27" font-weight="700">EM RISCO IMEDIATO, LIGUE 192 (SAMU)</text>
  <text x="500" y="1260" text-anchor="middle" fill="#718079" font-family="Arial,sans-serif" font-size="21">Material educativo • Não substitui atendimento profissional</text>
  <text x="500" y="1302" text-anchor="middle" fill="#718079" font-family="Arial,sans-serif" font-size="21">Versões A3 e A4 no arquivo PDF</text>
</svg>